[EDF41.Sniffer]
; Passive Steamworks/Winsock capture for EDF 4.1. It uses the game's legacy
; direct Steam accessors and never applies EDF5 addresses or memory patches.
Enabled=true

[EDF41.Coop8]
; Room-bot laboratory. The experimental switch below can expand the pinned
; net::Users/SessionController room-list rosters, but mission launch above four
; is not ready.
Enabled=true

[EDF41.Coop8.Settings]
; Eight is the development target. NativeSafeLimit is the fail-closed fallback.
TargetPlayers=8
NativeSafeLimit=4
; Diagnostics-only P5-P8 room-list test. The pinned net::Users and
; net::SessionController constructors expand allocation, capacity and logical
; size together in one validated transaction. Disable this to return to four.
ExperimentalRoomOverfill=true
ExperimentalRoomLimit=8
; F8 queues one synthetic room member; F7 removes the newest one. Actions are
; accepted only in a lobby created locally and run on Steam's callback thread.
BotHotkeyVK=119
BotRemoveHotkeyVK=118
; Private laboratory identity; fillers use adjacent account numbers.
BotSteamId=76561202255232023

[EDF5.Sniffer]
; Enables EDF5 diagnostics and network capture in a Diagnostics DLL.
; A Users DLL does not contain this code, regardless of this value.
Enabled=true

[EDF5.Coop8]
; Stable EDF5 multiplayer module. Settings for this module continue below.
Enabled=true

[EDF6.Sniffer]
; Scaffold only: implementation will be added before this should be enabled.
Enabled=false

[EDF6.Coop8]
; Scaffold only: depends on the EDF6 sniffer/reverse-engineering phase.
Enabled=false

[Diagnostics]
; Always-on diagnostics are independent from raw Steam/Winsock capture.
Enabled=true
; Essential, Balanced or Maximum. F10 temporarily enables Maximum behavior.
Profile=Balanced
; Off, Mini or Full. Full dumps may contain large amounts of sensitive memory.
CrashDumpMode=Mini
; 120=F9 creates a live state/minidump snapshot; 121=F10 toggles deep capture.
SnapshotHotkeyVK=120
DeepCaptureHotkeyVK=121
StallWarningSeconds=15
; Retention removes only sessions marked clean. Crash/abnormal sessions stay.
MaxSessions=20
MaxTotalMiB=1024
QueueMaxEvents=8192
QueueMaxMiB=16
RotateMiB=64
; F10 payload capture stops permanently for the current game session at this cap.
DeepSessionMiB=128
MaxPayloadBytes=65536

[Capture]
; Raw Steam/Winsock telemetry switch. Diagnostics and EDF5.Coop8 remain
; active when this is false.
Enabled=true

; Logical, pre-encryption Steamworks telemetry. EDF5.Coop8 installs its
; required Steam hooks independently when enabled.
Steam=true
; Callback observation. EDF 4.1 also uses the proven CCallbackBase dispatch
; slots to decode payloads and deliver native-safe room-bot events.
SteamCallbacks=true

; Raw process-wide socket/DNS layer.
Winsock=true

; Payloads are written only while Maximum/F10 capture is active.
PayloadPreviewBytes=64

; Durability/performance tradeoff for background file flushing.
FlushEveryEvents=32

; Relative paths are resolved from the active game's directory.
LogDirectory=Mods\TrafficSniffer\logs

[EDF5.Coop8.Settings]
; Lobby fillers only: F8 adds one with the native cm/ds Ready properties, F7
; removes the last one, and F6 reapplies those properties. The physical mouse wheel scrolls the
; PlayersGroup roster anywhere in the room window; cursor hover is not
; required. Fillers copy the host class/equipment before Ready is reapplied.
; They have no gameplay AI. F5 requests the native mission-clear result while
; a stage is active; it is a debug-only action. MaxPlayers accepts 5 through
; 8; extra mission participants recycle only the four native spawn points.
; Character source follows EDF5's final sorted table. Invalid extra class
; selectors are repaired without replacing UserImpl identity. Extra local-
; control ownership is reconstructed by membership in the local-user subset.
MaxPlayers=8
; Experimental foundation for future development. It is kept outside the
; active MultiSlot behavior unless this explicit opt-in is changed to true.
ExperimentalEnemySpawnMultiplier=false
; This optional count multiplier is separate from the core compatibility clamp
; that lets native difficulty/timer tables use their existing four-player
; profile while roster/network/result keep the real MaxPlayers count.
; When the experimental opt-in above is true, this multiplies only confirmed
; enemy-instantiation requests. Values are limited to 1..8 and EDF5's native
; live-enemy cap of 400 still applies. Keep 1 during MultiSlot development.
EnemySpawnMultiplier=1
; Development audit: the four proven roster containers allocate/construct this
; many slots. It must be at least MaxPlayers; eight covers the supported range.
PreallocatedRosterSlots=8
; Experimental test batch: expands 24 unidentified but coherent reserve(4)
; constructor groups to PreallocatedRosterSlots. This can be disabled
; independently for A/B crash comparison.
ExperimentalReservePatches=true
BotHotkeyVK=119
BotRemoveHotkeyVK=118
BotReadyHotkeyVK=117
; F4 opens Steam's invite dialog directly for the locally-created lobby.
InviteHotkeyVK=115
; Debug-only host harness. In a locally-created room with exactly one real
; player, F3 cycles host+3 inert dummies (native baseline), host+4 (P4
; probe), host+5/host+6/host+7 (P5-P7, six to eight participants), then Off.
; The cycle stops early at MaxPlayers. Dummies use distinct native UserImpl
; objects, copy the host loadout and never create real Steam connections.
LocalMissionHarnessEnabled=true
LocalMissionHarnessHotkeyVK=114
DebugStageWinEnabled=true
DebugStageWinHotkeyVK=116
; Measures the damage each player deals during a mission (written to the
; diagnostic log on every machine).
DamageMeterEnabled=true
; true: when the host returns to the room it also prints damage per second per
; player in its own room chat. Off while the totals are being validated: the
; host does not see every hit dealt by the other players.
DamageMeterChat=false
; With 5-8 players enemy HP keeps scaling past the native four-player
; profile. auto continues the difficulty table's last per-player step
; (Inferno: 1.25/1.30/1.35/1.40 for 5/6/7/8 players); a number sets the HP
; for that player count as a multiple of the four-player HP (0.1..20).
; false keeps the four-player HP.
ExtendedEnemyHealthScaling=true
EnemyHealth5Players=auto
EnemyHealth6Players=auto
EnemyHealth7Players=auto
EnemyHealth8Players=auto
; Base synthetic identity. Extra fillers receive adjacent private lab IDs.
; These are not real Steam accounts.
BotSteamId=76561202255233023
